<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1ECE1" />
      <stop offset="100%" stop-color="#E5DECE" />
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D3CABB" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#dotPattern)" />

  <!-- Center Circle Card -->
  <g transform="translate(300, 180)">
    <circle r="70" fill="#FFFFFF" stroke="#D3CABB" stroke-width="1.5" />
    
    <!-- Dish / Cloche Icon in Forest Green / Terracotta -->
    <path d="M-36 12 C-36 -25, 36 -25, 36 12 Z" fill="#3E5A17" opacity="0.9" />
    <circle cx="0" cy="-28" r="6" fill="#3E5A17" />
    <rect x="-42" y="14" width="84" height="6" rx="3" fill="#A84C35" />
    <path d="M-20 6 Q0 -6 20 6" stroke="#D7E7A5" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#24251F" letter-spacing="0.5">
    Authentic Campus Meal
  </text>
  <text x="300" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6B6D5E">
    MISE Campus Verified Cafeteria
  </text>
</svg>
